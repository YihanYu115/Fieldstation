<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fieldstation · 研究工作台</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#25332f;background:#f4f5f1;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#182d27;color:#d0ded6;padding:29px 17px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 39px}.mark{width:33px;height:33px;border:1px solid #8db5a0;border-radius:10px;display:grid;place-items:center;color:#c4dfcc;font-size:19px}.brand b{font-size:16px;letter-spacing:.02em;color:white}.brand small{display:block;font-size:10px;color:#8fa99c;letter-spacing:.13em;margin-top:3px}.navlabel{font-size:11px;color:#829c8e;padding:0 12px;margin:0 0 12px;letter-spacing:.09em}.nav{display:grid;gap:5px}.nav button{border:0;background:none;text-align:left;color:#b8cbc0;padding:12px;border-radius:7px;display:flex;gap:13px;align-items:center}.nav button:hover,.nav button.active{background:#304a3e;color:#fff}.icon{width:19px;text-align:center;font-size:16px;color:#9fbaaa}.side-bottom{margin-top:auto;border-top:1px solid #385046;padding:20px 10px 0;font-size:12px;line-height:1.8;color:#9eb4a8}.main{min-width:0}.top{height:72px;border-bottom:1px solid #e3e7df;background:#fafbf8;display:flex;align-items:center;justify-content:space-between;padding:0 45px}.crumb{color:#87958c;font-size:12px}.crumb strong{color:#43564b;font-weight:600}.topright{display:flex;align-items:center;gap:18px;color:#74847a;font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#bf9c59;margin-right:7px}.pill{border:1px solid #dce3d9;padding:7px 10px;border-radius:6px;color:#597064;background:#fff}.content{max-width:1440px;margin:auto;padding:38px 45px 70px}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:700;color:#73917f;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:26px}h1{font-family:Georgia,"Microsoft YaHei",serif;font-size:31px;letter-spacing:.01em;font-weight:500;margin:0;color:#243b30}.subtitle{color:#87948a;line-height:1.7;margin:9px 0 0}.head-actions{display:flex;gap:8px}.btn{border:1px solid #dce3d9;background:white;color:#52685a;border-radius:7px;padding:10px 14px}.btn.primary{background:#315a43;color:white;border-color:#315a43}.banner{border:1px solid #e7e1ce;background:#fbfaf4;color:#826e43;border-radius:8px;padding:12px 15px;margin-bottom:25px;font-size:12px;line-height:1.6}.banner.live{border-color:#d9e7dd;background:#f5faf5;color:#53725d}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:29px}.metric,.card{background:#fff;border:1px solid #e1e7de;border-radius:9px;box-shadow:0 2px 9px #243c2c06}.metric{padding:18px 19px;text-align:left;color:inherit}.metric:hover{border-color:#9eb9a5}.metric-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7c8a80}.metric-icon{width:29px;height:29px;border-radius:7px;background:#eff5ee;color:#678b70;display:grid;place-items:center}.metric strong{display:block;font-size:23px;font-weight:500;color:#304b3a;margin:13px 0 4px}.metric small{color:#9aa69c;font-size:11px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:18px}.card{padding:22px 23px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:19px}.card h2{font-size:15px;margin:0;color:#304337;font-weight:600}.card-head span{font-size:11px;color:#9aa79d}.link{border:0;background:none;color:#658d70;font-size:12px;padding:4px}.rows{display:grid}.row{border-top:1px solid #f0f2ee;padding:16px 0;display:flex;align-items:flex-start;gap:12px}.row:first-child{border-top:0;padding-top:3px}.row:last-child{padding-bottom:0}.rowicon{width:31px;height:31px;border-radius:7px;background:#f0f5ef;color:#789780;display:grid;place-items:center;flex:none}.rowbody{min-width:0;flex:1}.rowtitle{font-weight:600;color:#3c5043;margin-bottom:6px;overflow-wrap:anywhere}.rowtext{font-size:12px;color:#87958a;line-height:1.6;overflow-wrap:anywhere}.tag{font-size:10px;color:#668b70;background:#edf5ed;padding:5px 8px;border-radius:5px;white-space:nowrap}.tag.gold{background:#faf4e6;color:#aa8a4d}.tag.gray{background:#f2f4f0;color:#829087}.section{margin-top:20px}.service{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #f0f2ee;font-size:12px}.service:first-of-type{border:0}.service span:last-child{color:#9aa79d}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.toolbar input,.toolbar select{border:1px solid #dce3d9;border-radius:7px;background:white;padding:10px 12px;color:#43584a;min-width:180px}.toolbar input:focus{outline:2px solid #bed3c2}.empty{padding:50px 16px;text-align:center;color:#9aa79d;line-height:1.8}.detail{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9f5;border-radius:7px;padding:15px;font:12px/1.7 Consolas,monospace;color:#526457;max-height:440px;overflow:auto}.clickrow{cursor:pointer}.clickrow:hover .rowtitle{color:#5b8b69}.notice{font-size:11px;color:#9ba89d;line-height:1.6}.hidden{display:none!important}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:17px}.brand{padding:0 0 14px}.navlabel,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.top{padding:0 20px}.content{padding:30px 20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:480px){.topright .pill{display:none}.head{align-items:flex-start;flex-direction:column}.metrics{gap:8px}.content{padding:25px 14px}}
</style><link rel="stylesheet" href="/im.css"></head><body><div class="shell"><aside class="side"><div class="brand"><div class="mark">✳</div><div><b>Fieldstation</b><small>RESEARCH WORKSPACE</small></div></div><div class="navlabel">工作空间</div><nav class="nav" id="nav"></nav><div class="side-bottom">FIELDSTATION / 只读工作台<br>让研究持续接续</div></aside><main class="main"><div class="top"><div class="crumb">工作空间 &nbsp;/&nbsp; <strong id="crumb">概览</strong></div><div class="topright"><span id="modeLabel"><i class="dot"></i>示例数据</span><span class="pill">只读视图</span></div></div><div class="content"><div class="head"><div><div class="eyebrow" id="eyebrow">RESEARCH WORKSPACE</div><h1 id="title">研究工作台</h1><p class="subtitle" id="subtitle">在一个安静的地方，查看研究问题、材料与协作进展。</p></div><div class="head-actions"><button class="btn" id="modeButton">切换到实际连接</button><button class="btn primary" id="refresh">↻ &nbsp;刷新</button></div></div><div class="banner" id="banner"></div><div id="view"></div></div></main></div>
<script>
const nav=[['overview','◫','概览'],['im','◈','研究问题'],['board','▤','Board 交流'],['queue','☷','Queue 待办'],['host','♧','岗位目录']];
let page='overview',demo=true, issue='', boardKind='messages', imKind='issue', queueClaimed='', cursor='', snapshot='', lastData=null, readGeneration=0;
const examples={issue:{issue_id:'ISSUE-01',title:'理解实验条件与观测结果的关系',issue_type:'research',description:'围绕当前实验中的关键现象，逐步积累观察、分析与待验证的问题。'},children:{items:[{issue_id:'ISSUE-02',title:'比较不同条件下的观测',issue_type:'question'},{issue_id:'ISSUE-03',title:'检查分析方法的适用范围',issue_type:'question'}]},evidence:{items:[{evidence_id:'EV-001',kind:'observation',short_description:'首次实验条件与观测记录',quality_status:'待复核'},{evidence_id:'EV-002',kind:'analysis',short_description:'对照数据的初步分析',quality_status:'已记录'}]},detail:{evidence:{evidence_id:'EV-001',kind:'observation',short_description:'首次实验条件与观测记录',description:'这是用于展示界面结构的示例材料。'}},conclusions:{items:[{conclusion_id:'C-001',statement:'当前观察提示值得进一步比较，仍需更多证据。'}]},messages:{items:[{message_id:'MSG-012',issue_id:'ISSUE-01',text:'补充了对照组的观察记录，后续可以一起核对实验条件。',author:'研究成员'},{message_id:'MSG-011',issue_id:'ISSUE-03',text:'分析方法的适用范围还有一个问题需要讨论。',author:'研究成员'}]},handoffs:{items:[{handoff_id:'REQ-001',issue_id:'ISSUE-01',text:'请协助核对这组记录的来源。',recipient:'整理员',status:'pending'}]},instructions:{items:[]},tasks:{items:[{task_id:'TASK-008',issue_id:'ISSUE-02',instructions:'比较两组实验条件，记录可复用的观察。',experimenter_profile:'实验员',claim:null},{task_id:'TASK-007',issue_id:'ISSUE-03',instructions:'检查分析脚本使用的数据范围。',experimenter_profile:'分析员',claim:{principal_id:'worker'}}]},catalog:{items:[{role_name:'实验员',responsibility:'执行实验并记录观察',profile_name:'experimenter',purpose:'实验与原始记录',model_description:'由宿主配置',queue_consumer:true},{role_name:'整理员',responsibility:'整理材料与来源',profile_name:'curator',purpose:'材料整理',model_description:'由宿主配置',queue_consumer:false}]}};
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderNav(){ $('#nav').innerHTML=nav.map(([id,icon,label])=>`<button data-page="${id}" class="${id===page?'active':''}"><span class="icon">${icon}</span>${label}</button>`).join(''); document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page)); }
function go(p){readGeneration++;page=p;cursor='';snapshot='';lastData=null;render()}
async function fetchData(kind,params={}){if(demo){let result=structuredClone(examples[kind]);if(kind==='tasks')result.items=result.items.filter(x=>(!params.issue_id||x.issue_id===params.issue_id)&&(!params.claimed||Boolean(x.claim)===(params.claimed==='true')));return result;}let q=new URLSearchParams(Object.entries(params).filter(([,v])=>v));let r=await fetch('/api/'+kind+(q.size?'?'+q:''));let d=await r.json();if(!r.ok)throw new Error(d.error+(d.status?'（HTTP '+d.status+'）':''));return d}
function row(title,text,tag,icon='◇',action=''){return `<div class="row ${action?'clickrow':''}" ${action}><div class="rowicon">${icon}</div><div class="rowbody"><div class="rowtitle">${esc(title)}</div><div class="rowtext">${esc(text)}</div></div>${tag?`<span class="tag">${esc(tag)}</span>`:''}</div>`}
function heading(title,sub,eye){$('#title').textContent=title;$('#subtitle').textContent=sub;$('#eyebrow').textContent=eye;$('#crumb').textContent=nav.find(x=>x[0]===page)[2]}
function mode(){ $('#modeLabel').innerHTML=`<i class="dot" style="background:${demo?'#bf9c59':'#79a687'}"></i>${demo?'示例数据':'实际连接'}`;$('#modeButton').textContent=demo?'切换到实际连接':'查看示例';$('#banner').className='banner'+(demo?'':' live');$('#banner').textContent=demo?'当前为示例预览：页面中的问题、记录和岗位均为虚构内容，用于讨论界面。':'实际连接模式 · 各服务独立读取，显示结果受对应服务的主体权限约束。'; }
async function overview(){heading('研究工作台','在一个安静的地方，查看研究问题、材料与协作进展。','RESEARCH WORKSPACE');let keys=['issue','messages','tasks','catalog'];let params=[{id:issue},{},{},{}];let result=await Promise.allSettled(keys.map((k,i)=> k==='issue'&&!demo&&!issue?Promise.reject(Error('输入 Issue ID 后浏览')):fetchData(k,params[i])));let metrics=[['研究问题','从已知 Issue 进入','◈','im'],['Board 交流','信息、请求与人类指令','▤','board'],['Queue 待办','领取事实与简短回复','☷','queue'],['岗位目录','当前主体可见的配置','♧','host']];let state=result.map(r=>r.status==='fulfilled'?'可读取':r.reason.message);$('#view').innerHTML=`<div class="metrics">${metrics.map((m,i)=>`<button class="metric" data-jump="${m[3]}"><div class="metric-top">${m[0]}<span class="metric-icon">${m[2]}</span></div><strong>${demo?['01','02','02','02'][i]:'—'}</strong><small>${esc(demo?m[1]:state[i])}</small></button>`).join('')}</div><div class="grid"><div class="card"><div class="card-head"><h2>研究焦点</h2><button class="link" data-jump="im">浏览研究问题 →</button></div>${demo?row('理解实验条件与观测结果的关系','ISSUE-01 · 围绕关键现象积累观察与分析','研究问题','◈'):`<div class="empty">输入已知 Issue ID，查看其问题、子问题与材料。<br><button class="link" data-jump="im">进入研究问题 →</button></div>`}<div class="section"><div class="card-head"><h2>最近交流</h2><button class="link" data-jump="board">查看 Board →</button></div><div class="rows">${result[1].status==='fulfilled'?((result[1].value.items||[]).slice(0,3).map(x=>row(x.text||x.message_id,x.issue_id||'Board 消息','交流','▤')).join('')||'<div class="empty">暂无可见交流</div>'):`<div class="empty">${esc(state[1])}</div>`}</div></div></div><div><div class="card"><div class="card-head"><h2>工作空间</h2><span>独立服务</span></div>${['IM','Board','Queue','Host'].map((n,i)=>`<div class="service"><span><i class="dot" style="background:${result[i].status==='fulfilled'?'#87ac8d':'#d2b77f'}"></i>${n}</span><span>${esc(state[i])}</span></div>`).join('')}<p class="notice">各服务的读取范围分别由其授权决定。</p></div><div class="card section"><div class="card-head"><h2>关于这个工作台</h2></div><p class="rowtext">为长期研究保留清晰的上下文。问题、材料、交流和待办可以各自独立地被查看。</p><p class="notice">领取只表示领取；记录本身不代表研究完成。</p></div></div></div>`;document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>go(x.dataset.jump));}
function itemMarkup(kind,x){let id=x.issue_id||x.evidence_id||x.task_id||x.message_id||x.handoff_id||x.instruction_id||x.profile_name||'';let title=x.title||x.short_description||x.text||x.instructions||x.statement||x.role_name||id||'记录';let desc=[id,x.issue_id&&x.issue_id!==id?'Issue '+x.issue_id:'',x.responsibility||x.purpose||'',x.recipient?'接收：'+x.recipient:''].filter(Boolean).join(' · ');let tag=kind==='tasks'?(x.claim?'已领取':'未领取'):x.restricted?'受限':x.kind||x.issue_type||x.status||'';return row(title,desc,tag,'◇',`data-index="${esc(id)}"`)}
async function browse(){let defs={im:['研究问题','从已知 Issue 出发，浏览问题、材料与结论。','ISSUE MANAGER'],board:['Board 交流','查看信息、明确请求和人类指令。','BOARD'],queue:['Queue 待办','查看待办、领取事实与关联的工作线索。','QUEUE'],host:['岗位目录','查看当前主体获准展示的岗位与配置。','HOST CATALOG']};heading(...defs[page]);let options=page==='im'?`<select id="kind"><option value="issue">Issue 详情</option><option value="children">子问题</option><option value="evidence">Evidence</option><option value="conclusions">结论历史</option></select>`:page==='board'?`<select id="kind"><option value="messages">普通交流</option><option value="handoffs">明确请求</option><option value="instructions">人类指令</option></select>`:page==='queue'?`<select id="claimed" aria-label="领取状态"><option value="">全部待办</option><option value="false">未领取</option><option value="true">已领取</option></select>`:'';let needInput=page!=='host';$('#view').innerHTML=`<div class="toolbar">${options}${needInput?`<input id="issue" placeholder="${page==='im'?'输入 Issue ID':'按 Issue ID 筛选（可留空）'}" value="${esc(issue)}">`:''}<button class="btn primary" id="search">读取</button></div><div class="grid"><div class="card"><div class="card-head"><h2 id="listTitle">记录</h2><span>只读 · 当前页</span></div><div id="items" class="rows"><div class="empty">正在读取…</div></div><div id="more"></div></div><div class="card"><div class="card-head"><h2>记录详情</h2><span>原始字段</span></div><div id="detail" class="empty">选择一条记录以查看详情</div></div></div>`;if($('#kind')){$('#kind').value=page==='im'?imKind:boardKind;$('#kind').onchange=()=>{if(page==='im')imKind=$('#kind').value;else boardKind=$('#kind').value;cursor='';snapshot='';load()}}if($('#claimed')){$('#claimed').value=queueClaimed;$('#claimed').onchange=()=>{queueClaimed=$('#claimed').value;issue=$('#issue')?.value.trim()||'';cursor='';snapshot='';load()}}$('#search').onclick=()=>{issue=$('#issue')?.value.trim()||'';cursor='';snapshot='';load()};$('#issue')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('#search').click()});await load()}
async function load(){let generation=++readGeneration;let kind=page==='im'?imKind:page==='board'?boardKind:page==='queue'?'tasks':'catalog';let out=$('#items');if(!out)return;if(page==='im'&&!issue&&!demo){out.innerHTML='<div class="empty">请输入已知 Issue ID。<br>IM 按现有权限读取，不设统一浏览根。</div>';return}let params=page==='im'?{id:issue||'ISSUE-01',cursor,expected_snapshot:snapshot}:page==='host'?{}:page==='queue'?{issue_id:issue,cursor,claimed:queueClaimed}:{issue_id:issue,cursor};$('#detail').className='empty';$('#detail').textContent='选择一条记录以查看详情';out.innerHTML='<div class="empty">正在读取…</div>';try{let data=await fetchData(kind,params);if(generation!==readGeneration)return;lastData=data;let items=Array.isArray(data.items)?data.items:[data];out.innerHTML=items.length?items.map(x=>itemMarkup(kind,x)).join(''):'<div class="empty">此查询没有可见记录</div>';document.querySelectorAll('[data-index]').forEach((el,i)=>el.onclick=async()=>{let selected=items[i];if(!demo){let detailKind={evidence:'detail',messages:'message',handoffs:'handoff',instructions:'instruction',tasks:'task'}[kind];let id=selected.evidence_id||selected.message_id||selected.handoff_id||selected.instruction_id||selected.task_id;if(detailKind&&id&&!selected.restricted){try{selected=await fetchData(detailKind,{id});if(kind==='tasks'){try{selected={task:selected,replies:await fetchData('replies',{id})}}catch(e){selected={task:selected,replies_error:e.message}}}}catch(e){selected={error:e.message}}}}if(generation!==readGeneration)return;$('#detail').className='detail';$('#detail').textContent=JSON.stringify(selected,null,2)});let next=data.next_cursor||data.next_read?.arguments?.cursor;$('#more').innerHTML=next?'<button class="btn" id="next">下一页 →</button>':'';if(next)$('#next').onclick=()=>{cursor=next;snapshot=data.snapshot||'';load()}}catch(e){if(generation!==readGeneration)return;out.innerHTML=`<div class="empty">${esc(e.message)}<br>请检查宿主连接配置与当前主体的读取权限。</div>`;$('#more').innerHTML=''}}
function render(){if(page!=='im')imGeneration++;renderNav();mode();if(page==='overview')overview();else if(page==='im')renderIM();else browse()};$('#modeButton').onclick=()=>{readGeneration++;demo=!demo;cursor='';snapshot='';render()};$('#refresh').onclick=render;
</script><script src="/im.js"></script><script src="/graph.js"></script><script>render();</script></body></html>
