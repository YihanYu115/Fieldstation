<!-- footer -->
<text x="50" y="690" font-size="18">构图重点：实验室墙面有两块板；投件箱是小配角；IM 仓库里的证据网络清晰可见。</text>
<text x="50" y="726" font-size="16" fill="#647b72">亮色 / 灰色仅用于表现证据状态变化；正式图可保留概念提示，具体计算以正文说明为准。</text>
