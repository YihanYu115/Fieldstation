<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
<title id="title">Fieldstation 开头漫画构图草图：实验室、投件箱与 IM 仓库</title>
<desc id="desc">左侧窗外是探索现场，实验室墙上有留言板和待办板，人物在实验台工作。中间有投件箱，右侧是带证据网络和管理员的仓库；亮色与灰色展示证据网络的不同状态。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#72978c"/></marker></defs>
<rect width="1500" height="800" fill="#f8f6ef"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#294441">
<text x="48" y="55" font-size="29" font-weight="700">开头图构图草图</text><text x="48" y="89" font-size="17" fill="#6e817b">一个科研场景：探索现场 · 实验室 · 投件箱 · IM 仓库</text>
