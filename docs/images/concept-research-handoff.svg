<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Fieldstation 漫画构图草图：接续研究</title>
<desc id="desc">一位新加入的研究者在桌前阅读已有研究记录，另一位研究者指向记录。桌上的记录卡片连接研究问题、已有观察和待解决问题。画面只表现一次交接场景。</desc>
