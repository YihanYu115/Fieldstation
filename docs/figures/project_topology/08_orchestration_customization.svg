<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">编排层：固定框架与可定制部件</title><desc id="desc">通用框架提供可靠推进；协作规则、岗位说明、工具连接和模型接入由宿主显式装配。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="1600" height="940" fill="white"/><defs>
<marker id="core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker>
<marker id="custom" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
<marker id="store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/></marker>
</defs>
<rect x="40" y="325" width="1520" height="285" rx="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 7"/>
<text x="65" y="356" text-anchor="start" dominant-baseline="central" font-size="28" font-weight="700" fill="#475569">固定功能</text>
<path d="M 230,250 L 230,405" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#custom)" stroke-dasharray="7 6"/>
<path d="M 570,250 L 570,285 L 720,285 L 720,405" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#custom)" stroke-dasharray="7 6"/>
<path d="M 1295,250 L 1295,405" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#custom)" stroke-dasharray="7 6"/>
<path d="M 405,470 L 525,470" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#core)"/>
<path d="M 915,470 L 1090,470" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#core)" marker-start="url(#core)"/>
<path d="M 620,540 L 620,650 L 275,650 L 275,720" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#store)" marker-start="url(#store)"/>
<path d="M 880,720 L 880,655 L 1180,655 L 1180,540" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#custom)" stroke-dasharray="7 6"/>
<path d="M 1390,720 L 1390,540" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#custom)" stroke-dasharray="7 6"/>
<rect x="60" y="90" width="610" height="160" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="365.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">协作规则代码</text>
<text x="365.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">何时叫谁、怎样交接、何时继续</text>
<text x="365.0" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">显式注册规则；五岗是现有业务装配</text>
<rect x="930" y="90" width="610" height="160" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1235.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">岗位说明包</text>
<text x="1235.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">岗位职责、输入输出约定、工具清单</text>
<text x="1235.0" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">编辑文件 → 构建并加载岗位包</text>
<rect x="75" y="405" width="330" height="135" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="240.0" y="454.5" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">发现待处理工作</text>
<text x="240.0" y="495.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">读取变化、待办和留言</text>
<rect x="525" y="405" width="390" height="135" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="720.0" y="436.5" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">安排并监督执行</text>
<text x="720.0" y="477.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">检查授权、额度和重复请求</text>
<text x="720.0" y="512.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">观察进度、核对交付与恢复</text>
<rect x="1090" y="405" width="410" height="135" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="1295.0" y="436.5" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">岗位执行壳</text>
<text x="1295.0" y="477.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">harness：组织一次岗位会话</text>
<text x="1295.0" y="512.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">装入说明，连接模型与工具</text>
<rect x="60" y="720" width="430" height="150" rx="14" fill="#F1F5F9" stroke="#64748B" stroke-width="2.5"/>
<text x="275.0" y="759.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">编排自己的持久记录</text>
<text x="275.0" y="800.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">待办、留言、运行与接续进度</text>
<text x="275.0" y="835.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">独立于 IM 的领域账本</text>
<rect x="550" y="720" width="450" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="775.0" y="759.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">可选工具连接（MCP）</text>
<text x="775.0" y="800.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">IM 业务工具 / 项目计算工具</text>
<text x="775.0" y="835.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">宿主按权限选择并绑定</text>
<rect x="1090" y="720" width="450" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1315.0" y="759.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">模型 / Agent 接入</text>
<text x="1315.0" y="800.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">模型 API + 对话循环，或 CLI</text>
<text x="1315.0" y="835.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">宿主绑定来源、模型与预算</text>
<rect x="171.0" y="275.5" width="118.0" height="39" rx="4" fill="white"/>
<text x="230" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">识别条件</text>
<rect x="649.0" y="330.5" width="142.0" height="39" rx="4" fill="white"/>
<text x="720" y="350.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">派单与接续</text>
<rect x="1236.0" y="275.5" width="118.0" height="39" rx="4" fill="white"/>
<text x="1295" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">加载说明</text>
<rect x="406.0" y="427.5" width="118.0" height="39" rx="4" fill="white"/>
<text x="465" y="447.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">提出工作</text>
<rect x="931.0" y="415.5" width="142.0" height="39" rx="4" fill="white"/>
<text x="1002" y="435.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">派发 / 回报</text>
<rect x="347.0" y="630.5" width="166.0" height="39" rx="4" fill="white"/>
<text x="430" y="650.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#64748B">持久保存进度</text>
<rect x="981.0" y="635.5" width="118.0" height="39" rx="4" fill="white"/>
<text x="1040" y="655.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">连接工具</text>
<rect x="1307.0" y="630.5" width="166.0" height="39" rx="4" fill="white"/>
<text x="1390" y="650.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">绑定执行后端</text>
<text x="275" y="35" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#2563EB">实线蓝框：固定框架功能</text>
<text x="1035" y="35" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#7C3AED">虚线紫框：可编辑或替换的装配部件</text>
<text x="800" y="910" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">固定框架负责可靠推进；可定制部件定义协作方式、岗位行为和执行能力。</text>
</svg>