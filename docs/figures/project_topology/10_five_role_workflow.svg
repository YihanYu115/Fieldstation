<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">目前五岗工作流示意</title><desc id="desc">五岗经持久交付与显式请求协作；任务执行与材料整理、科学判断与结论交付按实际需要接续。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style><rect width="1600" height="940" fill="white"/><defs>
<marker id="core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker>
<marker id="custom" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
<marker id="store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/></marker>
<marker id="external" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/></marker>
<marker id="role" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/></marker>
</defs>
<path d="M 430,250 L 620,250" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)"/>
<path d="M 980,250 L 1170,250" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)"/>
<path d="M 1350,180 L 1350,100 L 250,100 L 250,180" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)" stroke-dasharray="7 6"/>
<path d="M 800,330 L 800,385 L 375,385 L 375,330" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)" stroke-dasharray="7 6"/>
<path d="M 170,330 L 170,560" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)" stroke-dasharray="7 6"/>
<path d="M 330,560 L 330,330" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)"/>
<path d="M 430,635 L 690,635" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)"/>
<path d="M 900,560 L 900,495 L 400,495 L 400,560" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#role)" stroke-dasharray="7 6"/>
<path d="M 1350,330 L 1350,830" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#core)"/>
<path d="M 250,710 L 250,830" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#core)"/>
<path d="M 900,710 L 900,830" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#core)"/>
<rect x="70" y="180" width="360" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="250.0" y="219.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">经理：安排工作</text>
<text x="250.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">把研究建议变成局部任务</text>
<text x="250.0" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">判断下一步、等待或结束</text>
<rect x="620" y="180" width="360" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="800.0" y="219.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">实验员：执行任务</text>
<text x="800.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">开展计算或实验</text>
<text x="800.0" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">交付结果、来源与验收判断</text>
<rect x="1170" y="180" width="360" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="1350.0" y="219.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">整理员：整理入账</text>
<text x="1350.0" y="260.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">整理材料，登记贡献</text>
<text x="1350.0" y="295.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">补充关系与整理意见</text>
<rect x="70" y="560" width="360" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="250.0" y="599.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">科学家：作出判断</text>
<text x="250.0" y="640.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">提出可检验的问题</text>
<text x="250.0" y="675.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">给出解释、方向和限制</text>
<rect x="690" y="560" width="410" height="150" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
<text x="895.0" y="599.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">结论员：形成结论</text>
<text x="895.0" y="640.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">核对判断与采用依据</text>
<text x="895.0" y="675.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">保存结论，或提出具体缺口</text>
<rect x="50" y="830" width="1500" height="95" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="800.0" y="859.5" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">IM：保存材料、证据关系与结论，维护历史和依据变化</text>
<text x="800.0" y="900.5" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">各岗按权限读写 IM；编排程序负责触发、交接、准确等待与恢复。</text>
<rect x="442.0" y="198.5" width="166.0" height="39" rx="4" fill="white"/>
<text x="525" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">发布局部任务</text>
<rect x="992.0" y="198.5" width="166.0" height="39" rx="4" fill="white"/>
<text x="1075" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">结果包已收件</text>
<rect x="537.0" y="80.5" width="526.0" height="39" rx="4" fill="white"/>
<text x="800" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">若经理已等待：指定材料的整理结果到达后接续</text>
<rect x="593.0" y="365.5" width="334.0" height="39" rx="4" fill="white"/>
<text x="760" y="385.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">验收未满足 / 执行已停的中断</text>
<rect x="67.0" y="410.0" width="166.0" height="70" rx="4" fill="white"/>
<text x="150" y="429.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">无可派工作时</text>
<text x="150" y="460.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">请求新方向</text>
<rect x="291.0" y="425.5" width="118.0" height="39" rx="4" fill="white"/>
<text x="350" y="445.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">研究建议</text>
<rect x="477.0" y="600.0" width="166.0" height="70" rx="4" fill="white"/>
<text x="560" y="619.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">判断与依据</text>
<text x="560" y="650.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">或原问题答复</text>
<rect x="503.0" y="475.5" width="334.0" height="39" rx="4" fill="white"/>
<text x="670" y="495.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#7C3AED">有具体科学缺口时：请求澄清</text>
<rect x="1255.0" y="535.0" width="190.0" height="70" rx="4" fill="white"/>
<text x="1350" y="554.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">保存贡献、关系</text>
<text x="1350" y="585.5" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">与整理结果</text>
<rect x="179.0" y="750.5" width="142.0" height="39" rx="4" fill="white"/>
<text x="250" y="770.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">新解释入账</text>
<rect x="805.0" y="750.5" width="190.0" height="39" rx="4" fill="white"/>
<text x="900" y="770.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">核对并保存结论</text>
<text x="360" y="35" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">实线：主要交付方向</text>
<text x="1130" y="35" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#7C3AED">虚线：满足标注条件后才请求或接续</text>
</svg>