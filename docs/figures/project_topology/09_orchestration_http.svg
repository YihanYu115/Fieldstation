<text x="760.0" y="519.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">安排并监督执行</text>
<text x="760.0" y="560.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">授权、派发、观察与恢复</text>
<text x="760.0" y="595.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">按真实交付回执结算</text>
