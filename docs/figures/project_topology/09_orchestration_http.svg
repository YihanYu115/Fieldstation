<rect x="438.0" y="205.5" width="84.0" height="39" rx="4" fill="white"/>
<text x="480" y="225.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#0F766E">HTTP</text>
<rect x="666.5" y="380.5" width="187.0" height="39" rx="4" fill="white"/>
<text x="760" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">HTTP 提交工作</text>
<rect x="1008.0" y="500.5" width="84.0" height="39" rx="4" fill="white"/>
<text x="1050" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">HTTP</text>
<rect x="1258.5" y="380.5" width="133.0" height="39" rx="4" fill="white"/>
<text x="1325" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#2563EB">本机 stdio</text>
<rect x="528.0" y="35.5" width="324.0" height="39" rx="4" fill="white"/>
<text x="690" y="55.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#0F766E">HTTP：读取材料、保存成果</text>
<rect x="138.0" y="550.5" width="214.0" height="39" rx="4" fill="white"/>
<text x="245" y="570.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#64748B">只访问自己的存储</text>
<rect x="1242.0" y="800.5" width="226.0" height="39" rx="4" fill="white"/>
<text x="1355" y="820.0" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="400" fill="#0F766E">HTTP（API 方式）</text>
<text x="545" y="850" text-anchor="middle" dominant-baseline="central" font-size="27" font-weight="400" fill="#475569">虚线框：可以分开部署的边界</text>
<text x="545" y="900" text-anchor="middle" dominant-baseline="central" font-size="25" font-weight="400" fill="#475569">HTTP 交接不要求共享数据库；工具 stdio 留在执行端。</text>
