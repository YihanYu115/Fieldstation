<text x="245.0" y="359.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">IM 公开接口</text>
<text x="245.0" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">读取与保存领域内容</text>
<text x="245.0" y="435.0" text-anchor="middle" dominant-baseline="central" font-size="26" font-weight="400" fill="#475569">检查权限、版本与事务</text>
