<text x="1115" y="141" text-anchor="start" dominant-baseline="central" font-size="28" font-weight="700" fill="#475569">岗位执行端（可多套）</text>
<path d="M 410,345 L 475,345 L 475,255 L 550,255" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#external)" marker-start="url(#external)"/>
<path d="M 760,320 L 760,480" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#core)"/>
