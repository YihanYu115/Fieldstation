<text x="760.0" y="720.0" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">待办 · 留言 · 运行记录</text>
<rect x="1130" y="195" width="390" height="125" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<text x="1325.0" y="239.5" text-anchor="middle" dominant-baseline="central" font-size="32" font-weight="700" fill="#172033">MCP 业务工具</text>
