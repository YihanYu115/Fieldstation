<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">IM 知识与依据关系</title><desc id="desc">贡献、必要依赖、采用根和冻结版本共同支持变化影响维护；科学判断由参与者作出。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1500" height="940" fill="white"/><defs>
<marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/></marker>
<marker id="arrow-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F766E"/></marker>
<marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C3AED"/></marker>
<marker id="arrow-project" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B45309"/></marker>
<marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/></marker>
<marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
<marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B91C1C"/></marker>
</defs>
<rect x="40" y="40" width="1420" height="585" rx="20" fill="white" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="64" y="71" font-size="23" fill="#2563EB" font-weight="600" text-anchor="start" dominant-baseline="central">IM 中保存的领域对象与声明关系</text>
<path d="M 580,217 L 370,217" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1080,217 L 850,217" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 235,440 L 235,275" fill="none" stroke="#B91C1C" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-warn)"/>
<path d="M 1230,275 L 1230,440" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1230,555 L 1230,745" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<rect x="100" y="160" width="270" height="115" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="235.0" y="202.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">Evidence A</text><text x="235.0" y="236.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">测量观察</text>
<rect x="580" y="160" width="270" height="115" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="715.0" y="202.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">Evidence B</text><text x="715.0" y="236.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">依据 A 得到的分析</text>
<rect x="1080" y="160" width="300" height="115" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1230.0" y="202.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">Conclusion K</text><text x="1230.0" y="236.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">本次明确采用 B</text>
<rect x="100" y="440" width="270" height="115" rx="16" fill="#FEF2F2" stroke="#B91C1C" stroke-width="2"/><text x="235.0" y="482.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">Evidence C</text><text x="235.0" y="516.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">仪器故障的有效反驳</text>
<rect x="580" y="440" width="270" height="115" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="715.0" y="482.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">Evidence D</text><text x="715.0" y="516.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">独立候选 · 尚未采用</text>
<path d="M1080,453 C1080,436 1380,436 1380,453 L1380,542 C1380,559 1080,559 1080,542 Z" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><path d="M1080,453 C1080,470 1380,470 1380,453" fill="none" stroke="#2563EB" stroke-width="1.3"/><text x="1230.0" y="489.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">材料冻结快照</text><text x="1230.0" y="523.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">固定采用材料的准确版本</text>
<rect x="100" y="745" width="1280" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="740.0" y="785.0" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">scoped-v2 资格与当前性维护</text><text x="740.0" y="819.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">若 C 可用且反驳有效：A 不可用 → B 不可用 → K 出现依据缺口</text><text x="740.0" y="849.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">由参与者重新判断；D 需要显式采用</text>
<rect x="392.5" y="168.0" width="165.0" height="34.0" rx="5" fill="white"/><text x="475" y="185.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">来源 + 必要依赖</text>
<rect x="916.5" y="178.0" width="97.0" height="34.0" rx="5" fill="white"/><text x="965" y="195.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">采用根 B</text>
<rect x="193.5" y="338.0" width="83.0" height="34.0" rx="5" fill="white"/><text x="235" y="355.0" font-size="20" fill="#B91C1C" font-weight="400" text-anchor="middle" dominant-baseline="central">refutes</text>
<rect x="1161.0" y="338.0" width="138.0" height="34.0" rx="5" fill="white"/><text x="1230" y="355.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">引用准确快照</text>
<rect x="1151.0" y="661.0" width="158.0" height="34.0" rx="5" fill="white"/><text x="1230" y="678.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">与当前状态比较</text>
</svg>