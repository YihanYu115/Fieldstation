<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">两种计算怎样协作</title><desc id="desc">先取出当前证据并计算其可用性，再与结论当时采用的材料比较，说明结论是否需要更新。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1600" height="940" fill="white"/><defs>
<marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/></marker>
<marker id="arrow-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F766E"/></marker>
<marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C3AED"/></marker>
<marker id="arrow-project" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B45309"/></marker>
<marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/></marker>
<marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
<marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B91C1C"/></marker>
</defs>
<rect x="40" y="30" width="1520" height="420" rx="20" fill="white" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="64" y="61" font-size="23" fill="#2563EB" font-weight="600" text-anchor="start" dominant-baseline="central">第一种计算  现在有哪些证据可以作为依据</text>
<rect x="40" y="500" width="1520" height="380" rx="20" fill="white" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="64" y="531" font-size="23" fill="#2563EB" font-weight="600" text-anchor="start" dominant-baseline="central">第二种计算  原结论是否需要更新</text>
<path d="M 400,192 L 540,192" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 940,192 L 1110,192" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1310,250 L 1310,340" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1310,430 L 1310,570 L 860,570 L 860,660" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 480,725 L 650,725" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1070,725 L 1220,725" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M80,148 C80,131 400,131 400,148 L400,237 C400,254 80,254 80,237 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><path d="M80,148 C80,165 400,165 400,148" fill="none" stroke="#64748B" stroke-width="1.3"/><text x="240.0" y="184.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">保存的证据和关系</text><text x="240.0" y="218.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">含内容与准确版本</text>
<rect x="540" y="135" width="400" height="115" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="740.0" y="177.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">4  取出并整理输入</text><text x="740.0" y="211.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">核对证据版本与关系指向</text>
<rect x="1110" y="135" width="400" height="115" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1310.0" y="177.5" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">5  按管理规则计算</text><text x="1310.0" y="211.5" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">依赖什么 · 被什么有效反驳</text>
<rect x="1110" y="340" width="400" height="90" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1310.0" y="370.0" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">当前依据的计算结果</text><text x="1310.0" y="404.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">可用 / 不可用 / 未决 · 缺口</text>
<path d="M80,673 C80,656 480,656 480,673 L480,777 C480,794 80,794 80,777 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><path d="M80,673 C80,690 480,690 480,673" fill="none" stroke="#64748B" stroke-width="1.3"/><text x="280.0" y="717.0" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">结论当时采用的材料</text><text x="280.0" y="751.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">保存的内容、版本和采用关系</text>
<rect x="650" y="660" width="420" height="130" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="860.0" y="695.0" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">6  对照当时与现在</text><text x="860.0" y="729.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">检查依据是否匹配</text><text x="860.0" y="759.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">找出需要更新的结论</text>
<rect x="1220" y="640" width="300" height="170" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1370.0" y="680.0" font-size="25" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">检查结果</text><text x="1370.0" y="714.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">仍匹配 / 需要更新</text><text x="1370.0" y="744.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">输入不完整则说明原因</text><text x="1370.0" y="774.0" font-size="21" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">记录受影响的结论</text>
<rect x="421.0" y="148.0" width="98.0" height="34.0" rx="5" fill="white"/><text x="470" y="165.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">相关记录</text>
<rect x="956.0" y="148.0" width="138.0" height="34.0" rx="5" fill="white"/><text x="1025" y="165.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">证据及其关系</text>
<rect x="1261.0" y="278.0" width="98.0" height="34.0" rx="5" fill="white"/><text x="1310" y="295.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">计算结果</text>
<rect x="961.0" y="553.0" width="218.0" height="34.0" rx="5" fill="white"/><text x="1070" y="570.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">现在同一批依据的状态</text>
<rect x="506.0" y="678.0" width="118.0" height="34.0" rx="5" fill="white"/><text x="565" y="695.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">当时的依据</text>
<rect x="1106.0" y="678.0" width="78.0" height="34.0" rx="5" fill="white"/><text x="1145" y="695.0" font-size="20" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">比较后</text>
</svg>