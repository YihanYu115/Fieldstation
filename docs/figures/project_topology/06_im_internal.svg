<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">IM 内核模块协作</title><desc id="desc">六组职责通过函数调用和同一数据库事务协作；图中文字按动作命名，当前依据计算与结论更新检查分别表达。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect width="1600" height="940" fill="white"/><defs>
<marker id="arrow-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB"/></marker>
<marker id="arrow-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0F766E"/></marker>
<marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C3AED"/></marker>
<marker id="arrow-project" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B45309"/></marker>
<marker id="arrow-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748B"/></marker>
<marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
<marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B91C1C"/></marker>
</defs>
<path d="M 340,95 L 500,95" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)" marker-start="url(#arrow-core)"/>
<path d="M 1020,150 L 1020,215 L 240,215 L 240,280" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 440,350 L 620,350" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 240,425 L 240,800" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 760,425 L 760,550" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 960,550 L 960,425" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1060,580 L 1180,580" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 1180,660 L 1060,660" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<path d="M 840,690 L 840,800" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)" marker-start="url(#arrow-core)"/>
<path d="M 1540,855 L 1570,855 L 1570,215 L 1140,215 L 1140,350 L 1060,350" fill="none" stroke="#0F766E" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-orch)"/>
<path d="M 620,395 L 540,395 L 540,800" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-core)"/>
<rect x="40" y="40" width="300" height="110" rx="3" fill="#F8FAFC" stroke="#475569" stroke-width="2"/><text x="190.0" y="78.0" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">外部调用者</text><text x="190.0" y="118.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">编排、工具或程序</text>
<rect x="500" y="40" width="1040" height="110" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1020.0" y="78.0" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">1  接收请求并检查权限</text><text x="1020.0" y="118.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">检查参数和身份 · 拒绝越权 · 识别重复请求</text>
<rect x="40" y="280" width="400" height="145" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="240.0" y="318.5" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">2  执行保存或修改</text><text x="240.0" y="358.5" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">保存问题、证据、关系和结论</text><text x="240.0" y="392.5" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">检查版本并记录修改历史</text>
<rect x="620" y="280" width="440" height="145" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="840.0" y="318.5" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">6  检查结论是否需更新</text><text x="840.0" y="358.5" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">对照当时与现在的依据</text><text x="840.0" y="392.5" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">记录原因及影响范围</text>
<rect x="620" y="550" width="440" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="840.0" y="586.0" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">4  取证据并核对版本</text><text x="840.0" y="626.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">读取相关证据及其关系</text><text x="840.0" y="660.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">整理成规则计算的输入</text>
<rect x="1180" y="550" width="360" height="140" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="1360.0" y="586.0" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">5  计算证据能否使用</text><text x="1360.0" y="626.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">根据必要依赖与有效反驳</text><text x="1360.0" y="660.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">返回可用、不可用或未决</text>
<path d="M40,813 C40,796 1540,796 1540,813 L1540,897 C1540,914 40,914 40,897 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/><path d="M40,813 C40,830 1540,830 1540,813" fill="none" stroke="#64748B" stroke-width="1.3"/><text x="790.0" y="845.0" font-size="32" fill="#172033" font-weight="600" text-anchor="middle" dominant-baseline="central">3  保存数据与历史</text><text x="790.0" y="885.0" font-size="26" fill="#475569" font-weight="400" text-anchor="middle" dominant-baseline="central">保存证据、关系、结论与当时依据；记录变化；修改与检查结果一起保存</text>
<rect x="351.0" y="46.0" width="138.0" height="38.0" rx="5" fill="white"/><text x="420" y="65.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">请求与结果</text>
<rect x="533.0" y="196.0" width="234.0" height="38.0" rx="5" fill="white"/><text x="650" y="215.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">通过检查的操作请求</text>
<rect x="461.0" y="301.0" width="138.0" height="38.0" rx="5" fill="white"/><text x="530" y="320.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">固定或核验</text>
<rect x="159.0" y="601.0" width="162.0" height="38.0" rx="5" fill="white"/><text x="240" y="620.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">保存本次修改</text>
<rect x="631.0" y="461.0" width="138.0" height="38.0" rx="5" fill="white"/><text x="700" y="480.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">取当前依据</text>
<rect x="933.0" y="496.0" width="234.0" height="38.0" rx="5" fill="white"/><text x="1050" y="515.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">当前材料与计算结果</text>
<rect x="1087.0" y="545.0" width="66.0" height="70.0" rx="5" fill="white"/><text x="1120" y="564.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">证据</text><text x="1120" y="596.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">关系</text>
<rect x="1075.0" y="625.0" width="90.0" height="70.0" rx="5" fill="white"/><text x="1120" y="644.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">可用性</text><text x="1120" y="676.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">与缺口</text>
<rect x="759.0" y="726.0" width="162.0" height="38.0" rx="5" fill="white"/><text x="840" y="745.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">读取相关记录</text>
<rect x="1191.0" y="196.0" width="258.0" height="38.0" rx="5" fill="white"/><text x="1320" y="215.0" font-size="24" fill="#0F766E" font-weight="400" text-anchor="middle" dominant-baseline="central">提交前检查受影响结论</text>
<rect x="399.0" y="726.0" width="282.0" height="38.0" rx="5" fill="white"/><text x="540" y="745.0" font-size="24" fill="#2563EB" font-weight="400" text-anchor="middle" dominant-baseline="central">保存当时材料与检查结果</text>
</svg>